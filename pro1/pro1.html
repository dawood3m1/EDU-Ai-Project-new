<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDU AI — نموذج أولي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F1E6;
    --paper-2:#ECE4D2;
    --card:#FBF8F1;
    --ink:#17212C;
    --ink-soft:#4B5560;
    --navy:#0E2A47;
    --navy-2:#173C61;
    --teal:#2F6F68;
    --teal-soft:#E4EEEC;
    --bronze:#AD8752;
    --bronze-soft:#F1E5CE;
    --brick:#A44832;
    --line:#DCD2B9;
    --white:#FFFFFF;
    --radius:14px;
    --shadow: 0 1px 2px rgba(23,33,44,.06), 0 8px 24px -12px rgba(23,33,44,.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    line-height:1.65;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Tajawal', sans-serif;
    font-weight:900;
    letter-spacing:-.01em;
    margin:0;
    color:var(--navy);
  }
  .mono{font-family:'IBM Plex Mono', monospace;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  ::selection{background:var(--bronze-soft);}
  :focus-visible{outline:2.5px solid var(--teal);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }

  .shell{max-width:1080px;margin:0 auto;padding:0 22px;}
  .topbar{
    position:sticky;top:0;z-index:20;
    background:rgba(245,241,230,.9);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{
    max-width:1080px;margin:0 auto;padding:14px 22px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .wordmark{
    display:flex;align-items:center;gap:10px;
    font-family:'Tajawal',sans-serif;font-weight:900;font-size:19px;color:var(--navy);
  }
  .wordmark .seal{
    width:30px;height:30px;border-radius:50%;
    border:2px solid var(--navy);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:800;color:var(--navy);
    font-family:'IBM Plex Mono',monospace;
  }
  .pill{
    font-size:11.5px;font-family:'IBM Plex Mono',monospace;
    padding:5px 11px;border-radius:99px;border:1px solid var(--line);
    color:var(--ink-soft);background:var(--card);white-space:nowrap;
  }
  .topbar-actions{display:flex;align-items:center;gap:10px;}
  .backbtn{
    display:flex;align-items:center;gap:6px;
    background:none;border:1px solid var(--line);border-radius:10px;
    padding:8px 14px;font-size:14px;color:var(--navy);font-weight:600;
    transition:.15s;
  }
  .backbtn:hover{background:var(--card);border-color:var(--navy);}

  /* ---------- LANDING ---------- */
  .hero{padding:64px 0 46px;}
  .hero-eyebrow{
    font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--teal);
    letter-spacing:.06em;margin-bottom:16px;display:flex;align-items:center;gap:8px;
  }
  .hero-eyebrow::before{content:'';width:22px;height:1.5px;background:var(--teal);}
  .hero h1{font-size:clamp(32px,5vw,50px);line-height:1.15;max-width:15ch;}
  .hero p.lead{
    margin-top:18px;font-size:17px;color:var(--ink-soft);max-width:56ch;
  }
  .role-grid{
    margin-top:44px;display:grid;grid-template-columns:1fr 1fr;gap:20px;
  }
  @media (max-width:760px){ .role-grid{grid-template-columns:1fr;} }
  .role-card{
    position:relative;background:var(--card);border:1px solid var(--line);
    border-radius:18px;padding:30px 26px 26px;box-shadow:var(--shadow);
    transition:.2s ease; cursor:pointer; text-align:start; overflow:hidden;
  }
  .role-card:hover{transform:translateY(-3px);border-color:var(--navy);}
  .role-card::after{
    content:'';position:absolute;inset-inline-start:-30px;bottom:-30px;width:110px;height:110px;
    border-radius:50%;background:var(--bronze-soft);opacity:.55;z-index:0;
  }
  .role-card > *{position:relative;z-index:1;}
  .role-icon{
    width:46px;height:46px;border-radius:12px;background:var(--navy);color:var(--white);
    display:flex;align-items:center;justify-content:center;margin-bottom:18px;font-size:20px;
  }
  .role-card h3{font-size:21px;margin-bottom:8px;}
  .role-card p{color:var(--ink-soft);font-size:14.5px;margin:0 0 20px;}
  .role-go{
    display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--navy);font-size:14.5px;
  }
  .role-go .arrow{transition:.2s;}
  .role-card:hover .role-go .arrow{transform:translateX(-4px);}

  .disclaimer{
    margin:46px 0 60px;padding:16px 18px;border-radius:12px;
    background:var(--teal-soft);border:1px dashed var(--teal);
    font-size:13px;color:#274c47;max-width:70ch;
  }

  /* ---------- ENTRY FORMS ---------- */
  .entry-wrap{padding:56px 0;max-width:480px;margin:0 auto;}
  .entry-card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;padding:34px 30px;box-shadow:var(--shadow);
  }
  .entry-card .kicker{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--teal);letter-spacing:.05em;margin-bottom:10px;}
  .entry-card h2{font-size:24px;margin-bottom:8px;}
  .entry-card p.sub{color:var(--ink-soft);font-size:14px;margin:0 0 26px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--navy);margin-bottom:6px;}
  .field input, .field select{
    width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-family:inherit;font-size:14.5px;
    background:var(--white);
  }
  .field input:focus, .field select:focus{border-color:var(--navy);outline:none;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:520px){.field-row{grid-template-columns:1fr;}}
  .entry-submit{
    width:100%;background:var(--navy);color:var(--white);border:none;border-radius:10px;padding:13px;font-weight:700;
    font-size:15px;margin-top:16px;transition:.15s;
  }
  .entry-submit:hover{background:var(--navy-2);}
  .entry-note{font-size:12px;color:var(--ink-soft);margin-top:14px;text-align:center; padding:10px; background:var(--paper-2); border-radius:8px;}

  /* ---------- STUDENT HUB ---------- */
  .subheader{padding:30px 0 4px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;}
  .subheader .kicker{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--bronze);letter-spacing:.05em;}
  .subheader h2{font-size:27px;margin-top:6px;}
  .edit-link{font-size:12.5px;color:var(--teal);font-weight:700;background:none;border:none;text-decoration:underline;}
  .tabs{display:flex;gap:8px;margin:22px 0 28px;border-bottom:1px solid var(--line);}
  .tab{
    padding:11px 18px;font-size:14.5px;font-weight:700;color:var(--ink-soft);
    border-bottom:2.5px solid transparent;background:none;border-top:none;border-inline:none;
    margin-bottom:-1px;
  }
  .tab.active{color:var(--navy);border-bottom-color:var(--navy);}
  .tab-desc{font-size:13.5px;color:var(--ink-soft);margin:-14px 0 22px;}

  .split{display:grid;grid-template-columns:280px 1fr;gap:20px;align-items:start;}
  @media (max-width:820px){ .split{grid-template-columns:1fr;} }

  .profile-card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;
  }
  .profile-card h4{font-size:13px;color:var(--ink-soft);font-weight:700;margin:0 0 14px;
    text-transform:uppercase;letter-spacing:.04em;font-family:'IBM Plex Mono',monospace;font-size:11px;}
  .prow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .prow:last-child{border-bottom:none;}
  .prow .k{color:var(--ink-soft);}
  .prow .v{font-weight:600;text-align:end;}
  .grade-A{color:var(--teal);} .grade-Bplus{color:var(--teal);} .grade-B{color:var(--bronze);}
  .flag{
    margin-top:14px;padding:10px 12px;background:#F7E9E4;border:1px solid #E3B9A8;border-radius:10px;
    font-size:12.5px;color:var(--brick);font-weight:600;
  }

  /* ---------- CHAT ---------- */
  .chat-shell{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    display:flex;flex-direction:column;height:520px;overflow:hidden;
  }
  .chat-log{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:14px;}
  .bubble{
    max-width:80%;padding:12px 15px;border-radius:14px;font-size:14.5px;line-height:1.7;white-space:pre-wrap;
  }
  .bubble.ai{align-self:flex-start;background:var(--white);border:1px solid var(--line);border-start-start-radius:4px;}
  .bubble.user{align-self:flex-end;background:var(--navy);color:var(--white);border-start-end-radius:4px;}
  .bubble.system{align-self:center;background:var(--bronze-soft);color:#5b4526;font-size:12.5px;border-radius:10px;}
  .bubble.typing{align-self:flex-start;display:flex;gap:5px;padding:14px 16px;background:var(--white);border:1px solid var(--line);}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ink-soft);animation:blink 1.2s infinite ease-in-out;}
  .dot:nth-child(2){animation-delay:.2s;} .dot:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.25;} 40%{opacity:1;}}

  .chat-input{
    display:flex;gap:10px;padding:14px;border-top:1px solid var(--line);background:var(--white);
  }
  .chat-input input{
    flex:1;border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:14.5px;
    font-family:inherit;background:var(--paper);
  }
  .chat-input input:focus{border-color:var(--navy);outline:none;}
  .send-btn{
    background:var(--navy);color:var(--white);border:none;border-radius:10px;padding:0 20px;font-weight:700;font-size:14px;
    transition:.15s;
  }
  .send-btn:hover{background:var(--navy-2);}
  .send-btn:disabled{opacity:.45;cursor:not-allowed;}

  /* ---------- STEPPER ---------- */
  .stepper-wrap{
    background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:18px;
  }
  .stepper-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .stepper-top .concept{font-weight:700;color:var(--navy);font-size:15px;}
  .stepper-top .phase{
    font-family:'IBM Plex Mono',monospace;font-size:11px;padding:4px 10px;border-radius:99px;
    background:var(--teal-soft);color:var(--teal);
  }
  .stepper{display:flex;align-items:center;}
  .step-node{
    width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--white);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;flex-shrink:0;transition:.25s;
  }
  .step-node.done{background:var(--teal);border-color:var(--teal);color:var(--white);}
  .step-node.current{border-color:var(--navy);color:var(--navy);box-shadow:0 0 0 4px var(--bronze-soft);}
  .step-line{flex:1;height:2px;background:var(--line);margin:0 4px;position:relative;}
  .step-line .fill{position:absolute;inset-inline-start:0;top:0;bottom:0;background:var(--teal);width:0%;transition:width .35s;}

  .stamp{
    display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:10px 14px;
    border:2px dashed var(--bronze);border-radius:10px;color:var(--bronze);font-weight:800;font-size:13px;
    background:var(--bronze-soft);animation:pop .4s ease;
  }
  @keyframes pop{0%{transform:scale(.8);opacity:0;}70%{transform:scale(1.05);}100%{transform:scale(1);opacity:1;}}

  .starter{
    background:var(--card);border:1px solid var(--line);border-radius:16px;padding:34px 28px;text-align:center;
  }
  .starter h3{font-size:19px;margin-bottom:8px;}
  .starter p{color:var(--ink-soft);font-size:14px;max-width:44ch;margin:0 auto 22px;}
  .starter-form{display:flex;gap:10px;max-width:440px;margin:0 auto;}
  .starter-form input{
    flex:1;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-family:inherit;font-size:14.5px;
  }
  .starter-form button{
    background:var(--navy);color:var(--white);border:none;border-radius:10px;padding:0 22px;font-weight:700;
  }
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px;}
  .chip{
    font-size:12.5px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--white);
    color:var(--ink-soft);cursor:pointer;
  }
  .chip:hover{border-color:var(--teal);color:var(--teal);}
  .chip.active-chip{background:var(--navy);color:var(--white);border-color:var(--navy);}

  .section-bind-note{
    background:var(--teal-soft);border:1px solid var(--teal);border-radius:10px;padding:10px 14px;
    font-size:12.5px;color:#1f4a45;margin:-8px 0 18px;
  }

  /* ---------- FACULTY ---------- */
  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin:22px 0 26px;}
  .stat-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;}
  .stat-card .num{font-family:'Tajawal',sans-serif;font-weight:900;font-size:30px;color:var(--navy);}
  .stat-card .lbl{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}

  .section-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:22px;}
  .section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
  .section-head h4{font-size:16px;color:var(--navy);}
  .section-head p{margin:4px 0 0;font-size:13px;color:var(--ink-soft);}
  .quiz-btn{
    background:var(--bronze);color:var(--white);border:none;border-radius:10px;padding:9px 16px;font-size:13.5px;
    font-weight:700;white-space:nowrap;
  }
  .quiz-btn:disabled{opacity:.5;}
  .question-list{margin-top:16px;border-top:1px solid var(--line);}
  .q-row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);}
  .q-row .qtext{font-size:14px;color:var(--ink);max-width:70ch;}
  .q-row .src{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);margin-top:4px;}
  .quiz-output{
    margin-top:16px;padding:16px 18px;background:var(--white);border:1px solid var(--line);border-radius:12px;
    font-size:14px;line-height:1.85;white-space:pre-wrap;
  }

  .fac-split{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;}
  @media (max-width:820px){.fac-split{grid-template-columns:1fr;}}
  .concept-list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;}
  .concept-row{
    display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line);
    cursor:pointer;transition:.15s;
  }
  .concept-row:last-child{border-bottom:none;}
  .concept-row:hover, .concept-row.active{background:var(--teal-soft);}
  .concept-row .name{font-weight:700;font-size:14.5px;color:var(--navy);}
  .concept-row .meta{font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .count-badge{
    font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--navy);color:var(--white);
    padding:3px 10px;border-radius:99px;flex-shrink:0;margin-inline-start:10px;
  }
  .empty{padding:30px 20px;text-align:center;color:var(--ink-soft);font-size:13.5px;}

  .suggestion-panel{
    background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;min-height:200px;
  }
  .suggestion-panel h4{font-size:15px;color:var(--navy);margin-bottom:12px;}
  .suggestion-body{font-size:14px;line-height:1.85;color:var(--ink);white-space:pre-wrap;}
  .suggestion-placeholder{color:var(--ink-soft);font-size:13.5px;text-align:center;padding:40px 10px;}
  .gen-btn{
    background:var(--teal);color:var(--white);border:none;border-radius:10px;padding:9px 16px;font-size:13.5px;
    font-weight:700;margin-top:14px;
  }
  .gen-btn:disabled{opacity:.5;}

  .footer-note{margin:40px 0 60px;font-size:12.5px;color:var(--ink-soft);text-align:center;}

  /* ---------- levels / intent / policy / sandbox / lecture ---------- */
  .level-badge{
    display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:11px;
    padding:5px 11px;border-radius:99px;background:var(--navy);color:var(--white);white-space:nowrap;
  }
  .info-toggle{
    background:none;border:none;color:var(--teal);font-size:12.5px;font-weight:700;text-decoration:underline;
    padding:0;margin:2px 0 18px;display:inline-block;
  }
  .info-panel{
    background:var(--teal-soft);border:1px solid var(--teal);border-radius:12px;padding:16px 18px;margin:-6px 0 20px;
    font-size:13px;color:#1f4a45;
  }
  .info-panel ul{margin:8px 0 0;padding-inline-start:20px;}
  .info-panel li{margin-bottom:5px;}
  .privacy-note{
    display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft);padding:8px 14px 0;
  }

  .bubble.policy{
    align-self:flex-start;background:#FDECE7;border:1.5px solid var(--brick);color:#6e2c1c;
    border-start-start-radius:4px;
  }
  .bubble.policy .p-tag{
    display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:800;color:var(--brick);
    margin-bottom:6px;letter-spacing:.02em;
  }

  .sandbox-box{
    margin-top:14px;padding:14px 16px;border-radius:12px;border:1.5px dashed var(--bronze);background:#FBF3E4;
  }
  .sandbox-box.approved{border:1.5px solid var(--teal);background:var(--teal-soft);}
  .sandbox-tag{
    display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;
    font-weight:800;padding:3px 9px;border-radius:99px;background:var(--bronze);color:var(--white);margin-bottom:10px;
  }
  .sandbox-tag.approved{background:var(--teal);}
  .approve-btn{
    background:var(--navy);color:var(--white);border:none;border-radius:9px;padding:8px 15px;font-size:12.5px;
    font-weight:700;margin-top:12px;
  }
  .approved-note{font-size:11.5px;color:var(--teal);font-weight:700;margin-top:10px;}

  .action-log{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-top:22px;}
  .action-log h4{font-size:15px;color:var(--navy);margin-bottom:12px;}
  .log-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .log-row:last-child{border-bottom:none;}
  .log-row .ts{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);white-space:nowrap;}

  /* ---------- BILINGUAL (AR/EN) ---------- */
  .langbtn{
    font-weight:700;
    background:var(--navy);
    color:var(--white);
    border:1px solid var(--navy);
  }
  .langbtn:hover{background:var(--navy-2);border-color:var(--navy-2);}
  [dir="ltr"] .role-card:hover .role-go .arrow{transform:translateX(4px);}
  [dir="ltr"] body{letter-spacing:0;}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="wordmark"><span class="seal">AI</span> EDU AI</div>
    <div class="topbar-actions" id="topbarActions"></div>
  </div>
</div>
<div class="shell" id="app"></div>

<script>
/* ---------------- MOCK DATABASES (قواعد البيانات الوهمية لتسجيل الدخول) ---------------- */
const MOCK_USERS = [
  { uid: '442109981', pass: '123456', name: 'أحمد عبدالله', major: 'بكالوريوس علوم الحاسب', level: 'المستوى الخامس' },
  { uid: '442109982', pass: '654321', name: 'سارة العتيبي', major: 'بكالوريوس هندسة البرمجيات', level: 'المستوى السادس' }

/* ---------------- MOCK STORAGE (localStorage-backed persistence) ---------------- */
window.storage = (function(){
  const PREFIX = 'eduai_';
  return {
    async get(key){
      try{
        const v = localStorage.getItem(PREFIX + key);
        return v === null ? null : { value: v };
      }catch(e){ return null; }
    },
    async set(key, value){
      try{
        localStorage.setItem(PREFIX + key, value);
        return true;
      }catch(e){ return false; }
    }
  };
})();

async function initSeedStorage(){
  const defs = {
    'concept-log': () => JSON.stringify(buildSeedConcepts()),
    'question-log': () => JSON.stringify(buildSeedQuestions()),
    'lectures': () => JSON.stringify(buildSeedLectures()),
    'review-log': () => '[]',
    'action-log': () => '[]'
  };
  for(const key in defs){
    try{
      const r = await window.storage.get(key);
      if(!r || !r.value) await window.storage.set(key, defs[key]());
    }catch(e){}
  }
}

const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const normalizeDup = (s) => (s || '').toLowerCase().replace(/\s+/g, ' ').trim().slice(0, 120);
const lastAiByKey = {};
function isDuplicate(key, text){
  const n = normalizeDup(text);
  const prev = lastAiByKey[key] || '';
  if(prev && n === prev) return true;
  lastAiByKey[key] = n;
  return false;
}
function resetDupGuard(key){ lastAiByKey[key] = ''; }
function translateServerError(status){
  if(status === 401 || status === 403) return t('خطأ في المصادقة مع الخادم. تأكد من صحة مفتاح API.');
  if(status === 429) return t('نواجه ضغطاً في الخادم حالياً، يرجى المحاولة بعد قليل.');
  if(status >= 500 || status >= 400) return tpl('الخادم رفض الطلب ({1}) — تأكد من تشغيل proxy_server.py.', { 1: status });
  return t('لا يوجد رد صالح من الخادم.');
}
async function ensureFreshReply(key, text, refreshFn){
  if(!isDuplicate(key, text)) return text;
  const attempt = await refreshFn();
  if(!isDuplicate(key, attempt)) return attempt;
  return t('عذرًا، يبدو أنني كرّرت نفس الرد. سأحاول صياغة إجابة جديدة.');
}

async function callClaude(systemPrompt, history, meta){
  const MAX_ATTEMPTS = 3;
  const body = {
    model: "gemini-flash-latest",
    max_tokens: 1000,
    system: systemPrompt,
    messages: history,
    temperature: 0.7,
    frequency_penalty: 0.7,
    presence_penalty: 0.7
  };
  let lastKind = 'network';
  for(let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++){
    if(attempt > 1) await sleep(1200 * (attempt - 1));
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 30000);
    let res;
    try{
      res = await fetch("http://localhost:5000/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        signal: ctrl.signal,
        body: JSON.stringify(body)
      });
    }catch(e){
      if(e && e.name === 'AbortError') lastKind = 'timeout';
      else lastKind = 'network';
      continue;
    }finally{
      clearTimeout(timer);
    }
    if(res.status === 429 || res.status >= 500){
      lastKind = 'server';
      continue;
    }
    if(!res.ok){
      state.offlineMode = true;
      return translateServerError(res.status);
    }
    const data = await res.json().catch(() => null);
    if(data && typeof data.text === 'string' && data.text.trim()){
      state.offlineMode = false;
      return data.text.trim();
    }
    lastKind = 'parse';
  }
  state.offlineMode = true;
  if(lastKind === 'timeout') return t('انتهت مهلة الاتصال بالخادم. حاول مرة أخرى.');
  if(lastKind === 'server') return t('نواجه ضغطاً في الخادم حالياً، يرجى المحاولة بعد قليل.');
  return offlineReply(meta || {}, history);
}

function networkErrorMessage(code){
  if(code === 'timeout') return t('انتهت مهلة الاتصال بالخادم. حاول مرة أخرى.');
  if(code === 'server') return t('تعذر الاتصال بالمساعد: مشكلة في الخادم. تأكد من تشغيل proxy_server.py ثم أعد المحاولة.');
  return t('تعذر الاتصال بالمساعد: مشكلة في الشبكة. حاول مرة أخرى.');
}

    actions.innerHTML += `<button class="backbtn" onclick="goLanding()">${t('العودة للرئيسية')}</button>`;

  attachHandlers();
}

function renderStepper(){
  const tr = state.tutor;
  const total = Math.max(tr.total || 5, tr.step);
  let nodes = '';
  for(let i=1;i<=total;i++){
    const cls = i < tr.step || tr.mastered ? 'done' : (i === tr.step ? 'current' : '');
    nodes += `<div class="step-node ${cls}">${(i<tr.step||tr.mastered) ? '✓' : i}</div>`;
    if(i < total){
      const fillPct = i < tr.step || tr.mastered ? 100 : 0;
      nodes += `<div class="step-line"><div class="fill" style="width:${fillPct}%"></div></div>`;
    }
  }
  return `
  <div class="stepper-wrap">
    <div class="stepper-top">
      <span class="concept">${tr.mode==='review' ? '📋 ' : '📘 '}${tr.concept ? escapeHtml(t(tr.concept)) : t('جاري تحديد المفهوم...')}</span>
      <span class="phase">${phaseLabel(tr.phase)}</span>
    </div>
    <div class="stepper">${nodes}</div>
    ${tr.mastered ? `<div class="stamp">✓ ${tr.mode==='review' ? t('أكملت المراجعة — سُجّلت لدكتور شعبتك') : t('تم إتقان المفهوم — سُجّل لدكتور شعبتك')}</div>` : ''}
  </div>`;
}

function renderFaculty(){
  const f = state.faculty;
  if(!f.loaded){
    loadFacultyLogs().then(render);
    return `<div class="subheader"><div><div class="kicker">${t('لوحة عضو هيئة التدريس')}</div><h2>${t('جاري تحميل البيانات...')}</h2></div></div>`;
  }
  const sec = getSection(f.currentSectionId);
  const topics = sec ? sec.topics : [];
  const sectionConceptLog = f.conceptLog.filter(e=>e.sectionId===f.currentSectionId);
  const sectionQuestionLog = f.questionLog.filter(e=>e.sectionId===f.currentSectionId);

  const conceptCounts = {};
  sectionConceptLog.forEach(e => { conceptCounts[e.concept] = (conceptCounts[e.concept]||0) + 1; });
  const conceptRows = Object.entries(conceptCounts).sort((a,b)=>b[1]-a[1]);

  const questionCounts = {};
  const questionSource = {};
  sectionQuestionLog.forEach(e => {
    const key = (e.question||'').trim();
    if(!key) return;
    questionCounts[key] = (questionCounts[key]||0) + 1;
    questionSource[key] = e.source;
  });
  const questionRows = Object.entries(questionCounts).sort((a,b)=>b[1]-a[1]);

  const totalQuestions = sectionQuestionLog.length;
  const topQCount = questionRows.length ? questionRows[0][1] : 0;
  const totalMastered = sectionConceptLog.length;

  const activeLecture = f.lectures.find(l=>l.sectionId===f.currentSectionId && !l.endedAt);
  const pastLectures = f.lectures.filter(l=>l.sectionId===f.currentSectionId && l.endedAt).sort((a,b)=>b.endedAt-a.endedAt);
  const lastLecture = pastLectures[0] || null;
  const liveCount = activeLecture ? sectionQuestionLog.filter(q=>q.lectureId===activeLecture.id).length : 0;
  const nextStartIdx = (lastLecture && typeof lastLecture.endTopicIdx==='number') ? Math.min(lastLecture.endTopicIdx+1, Math.max(topics.length-1,0)) : 0;
  const reviewCountForLast = lastLecture ? f.reviewLog.filter(r=>r.sectionId===f.currentSectionId && r.ts>=lastLecture.endedAt).length : 0;

function submitProfile(){
  const uid = document.getElementById('fUid').value.trim();
  const pass = document.getElementById('fPass').value.trim();
  
  if(!uid || !pass){
    alert(t('الرجاء إدخال الرقم الجامعي وكلمة المرور.'));
    return;
  }
  
  // التحقق من قاعدة البيانات الوهمية
  const user = MOCK_USERS.find(u => u.uid === uid && u.pass === pass);
  
  if(!user){
    alert(t('الرقم الجامعي أو كلمة المرور غير صحيحة.'));
    return;
  }
  
  const btn = document.getElementById('studentLoginBtn');
  btn.innerText = t('جاري التحقق...');
  btn.disabled = true;
  
  setTimeout(() => {
    // حفظ بيانات الطالب مؤقتًا ثم الانتقال لاختيار المادة والشعبة قبل الجلسة
    state.pendingProfile = { name: user.name, uid: user.uid, major: user.major, level: user.level };

    render();
  }, 600);
}

function scrollLog(key){
  const el = document.getElementById('log-'+key);
  if(el) el.scrollTop = el.scrollHeight;
}

async function sendMessage(key){
  const input = document.getElementById('input-'+key);
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  const data = state[key];
  const isFirstUserMsg = !data.questionLogged;
  data.messages.push({role:'user', text});
  data.loading = true;
  render(); scrollLog(key);

  if(isFirstUserMsg && key==='academic'){
    data.questionLogged = true;
    pushQuestionLog(text, 'academic', state.profile.sectionId);
  }

  try{
    if(key === 'academic'){
      const agent = resolveAgent(key);
      const history = data.messages.filter(m=>m.role!=='system').map(m=>({role: m.role==='policy' ? 'assistant' : m.role, content:m.text}));
      let reply = await callClaude(agent.prompt(), history, { scenario:'academic' });
      let cleaned = reply.replace(/```json|```/g, '').trim();
      const isPolicy = /^\[?POLICY_BLOCK\]?\s*/i.test(cleaned);
      let clean = cleaned.replace(/^\[?POLICY_BLOCK\]?\s*/i, '').trim();
      if(!isPolicy){
        clean = await ensureFreshReply('academic', clean, async () => {
          const retry = await callClaude(agent.prompt(), history.concat([{role:'assistant', content:clean},{role:'user', content:t('لا تكرر نفس إجابتك السابقة، أعد الصياغة من جديد بمحتوى مختلف.')}]), { scenario:'academic' });
          return retry.replace(/```json|```/g, '').trim().replace(/^\[?POLICY_BLOCK\]?\s*/i, '').trim();
        });
      }
      data.messages.push({role: isPolicy ? 'policy' : 'ai', text: clean});
    } else {
      await advanceTutor(text);
    }
  }catch(e){
    data.messages.push({role:'system', text:networkErrorMessage(e && e.message)});
  }
  data.loading = false;
  render(); scrollLog(key);
}

function quickStart(topic){
  document.getElementById('starterInput').value = topic;
  startTutor();
}
async function startTutor(){
  const input = document.getElementById('starterInput');
  const topic = input.value.trim();
  if(!topic) return;
  const tr = state.tutor;
  tr.started = true;
  resetDupGuard('tutor');
  tr.mode = 'open';
  tr.reviewTopics = [];
  tr.loading = true;
  tr.mastered = false;
  tr.step = 1; tr.total = 5;
  tr.concept = '';
  tr.messages = [{role:'user', text: topic}];
  tr.questionLogged = true;
  pushQuestionLog(topic, 'tutor', state.profile.sectionId);
  render();
  try{
    await advanceTutor(topic);
  }catch(e){
    tr.messages.push({role:'system', text:networkErrorMessage(e && e.message)});
  }
  tr.loading = false;
  render(); scrollLog('tutor');
}

async function startReview(){
  const sec = getSection(state.profile.sectionId);
  const lec = state.lastEndedLectureForStudent;
  if(!sec || !lec) return;
  const topics = sec.topics.slice(lec.startTopicIdx, lec.endTopicIdx+1);
  const tr = state.tutor;
  tr.started = true;
  resetDupGuard('tutor');
  tr.mode = 'review';
  tr.reviewTopics = topics;
  tr.loading = true;
  tr.mastered = false;
  tr.step = 1; tr.total = topics.length; tr.concept = t('مراجعة محاضرة اليوم');
  tr.messages = [{role:'user', text: t('ابدأ المراجعة')}];
  tr.questionLogged = true;
  pushQuestionLog(tpl('مراجعة المحاضرة: {a} ← {b}', { a: t(topics[0]), b: t(topics[topics.length-1]) }), 'review', state.profile.sectionId);
  render();
  try{
    await advanceTutor(t('ابدأ المراجعة'));
  }catch(e){
    tr.messages.push({role:'system', text:networkErrorMessage(e && e.message)});
  }
  tr.loading = false;
  render(); scrollLog('tutor');
}

async function advanceTutor(userText){
  const t = state.tutor;
  const history = t.messages.filter(m=>m.role==='user'||m.role==='ai').map(m=>({
    role: m.role==='ai' ? 'assistant' : 'user',
    content: m.role==='ai' ? m.rawJson || m.text : m.text
  }));
  const agent = resolveAgent('tutor');
  const systemPrompt = agent.prompt() + langInstruction();
  const raw = await callClaude(systemPrompt, history, { scenario:'tutor', mode:t.mode, phase:t.phase, step:t.step, total:t.total, concept:t.concept });
  let parsed;
  try{
    const cleaned = raw.replace(/```json|```/g,'').trim();
    parsed = JSON.parse(cleaned);
  }catch(e){
    parsed = { message: raw, phase:'assessment', step_number:t.step, total_steps_estimate:t.total, concept_title:t.concept, mastered:false };
  }
  if(parsed && typeof parsed.message === 'string'){
    parsed.message = await ensureFreshReply('tutor', parsed.message, async () => {
      const retry = await callClaude(systemPrompt, history.concat([{role:'assistant', content:raw},{role:'user', content:t('لا تكرر نفس إجابتك السابقة، أعد الصياغة من جديد بمحتوى مختلف.')}]), { scenario:'tutor', mode:t.mode, phase:t.phase, step:t.step, total:t.total, concept:t.concept });
      try{
        const rp = JSON.parse(retry.replace(/```json|```/g,'').trim());
        return (rp && rp.message) ? rp.message : retry;
      }catch(e2){ return retry; }
    });
  }
  t.messages.push({role:'ai', text: parsed.message || '...', rawJson: JSON.stringify(parsed)});
  const PHASES = ['assessment','explaining','summary','verification','mastered'];
  t.phase = PHASES.includes(parsed.phase) ? parsed.phase : t.phase;
  t.step = Math.max(t.step, parsed.step_number || t.step);
  t.total = parsed.total_steps_estimate || t.total;
  if(t.mode!=='review') t.concept = parsed.concept_title || t.concept;
  const minMasterStep = t.mode === 'review' ? Math.max(1, Math.min(3, t.total || 3)) : 3;
  if(parsed.mastered && t.step >= minMasterStep){
    t.mastered = true;
    if(t.mode==='review'){
      await pushReviewLog(state.profile.sectionId);
    } else {
      await pushConceptLog(t.concept, state.profile.sectionId);
    }
  }
}

  state.faculty.suggestion = '';

async function generateSuggestion(){

  f.suggestionLoading = true;
  f.suggestionApproved = false;
  render();

    const reply = await callClaude(suggestionPrompt(f.selected, sec?sec.course:''), [{role:'user', content:'ابدأ'}], { scenario:'suggestion' });
    f.suggestion = reply.trim();
  }catch(e){
    f.suggestion = networkErrorMessage(e && e.message);
  }
  f.suggestionLoading = false;
  render();
}
async function approveSuggestion(){
  const f = state.faculty;
  f.suggestionApproved = true;
  render();
  const updated = await pushActionLog(t('اعتماد اقتراح إعادة شرح لمفهوم: '), f.selected);
  if(updated) f.actionLog = updated;
  render();
}

async function generateQuiz(){
  const f = state.faculty;
  const sec = getSection(f.currentSectionId);
  const cLog = f.conceptLog.filter(e=>e.sectionId===f.currentSectionId);
  const qLog = f.questionLog.filter(e=>e.sectionId===f.currentSectionId);
  const conceptCounts = {};
  cLog.forEach(e => { conceptCounts[e.concept] = (conceptCounts[e.concept]||0) + 1; });
  const conceptRows = Object.entries(conceptCounts).sort((a,b)=>b[1]-a[1]);
  const questionCounts = {};
  qLog.forEach(e => { const k=(e.question||'').trim(); if(k) questionCounts[k]=(questionCounts[k]||0)+1; });
  const questionRows = Object.entries(questionCounts).sort((a,b)=>b[1]-a[1]);

  f.quizLoading = true;
  f.quizApproved = false;
  render();
  try{
    const reply = await callClaude(quizPrompt(questionRows, conceptRows, sec?sec.course:''), [{role:'user', content:'ابدأ'}], { scenario:'quiz' });
    f.quizText = reply.trim();
  }catch(e){
    f.quizText = networkErrorMessage(e && e.message);
  }
  f.quizLoading = false;
  render();
}
async function approveQuiz(){
  const f = state.faculty;
  f.quizApproved = true;
  render();
  const updated = await pushActionLog(t('اعتماد أسئلة نقاش للمحاضرة مولّدة من فجوات الطلاب'));
  if(updated) f.actionLog = updated;
  render();
}

async function startLecture(){
  const f = state.faculty;
  const startIdx = parseInt(document.getElementById('fStartTopic').value, 10);
  const id = 'lec_' + Date.now();
  const entry = { id, sectionId: f.currentSectionId, startedAt: Date.now(), endedAt: null, startTopicIdx: startIdx, endTopicIdx: null };
  let arr = [];
  try{ const r = await window.storage.get('lectures', true); arr = r && r.value ? JSON.parse(r.value) : []; }catch(e){ arr=[]; }
  arr.push(entry);
  try{ await window.storage.set('lectures', JSON.stringify(arr), true); }catch(e){}
  f.lectures = arr;
  render();
}
async function endLecture(){
  const f = state.faculty;
  const endIdx = parseInt(document.getElementById('fEndTopic').value, 10);
  let arr = [];
  try{ const r = await window.storage.get('lectures', true); arr = r && r.value ? JSON.parse(r.value) : []; }catch(e){ arr=[]; }
  const idx = arr.findIndex(l=>l.sectionId===f.currentSectionId && !l.endedAt);
  if(idx>-1){ arr[idx].endedAt = Date.now(); arr[idx].endTopicIdx = endIdx; }
  try{ await window.storage.set('lectures', JSON.stringify(arr), true); }catch(e){}
  f.lectures = arr;
  render();
  const secObj = getSection(f.currentSectionId);
  const updated = await pushActionLog(t('إنهاء محاضرة شعبة '), secObj ? secObj.number : '');
  if(updated) f.actionLog = updated;
  render();
}
async function refreshFaculty(){
  await loadFacultyLogs();
  render();
}

function attachHandlers(){
  ['input-academic','input-tutor','starterInput','fUid', 'fPass', 'fFacultyPass'].forEach(id=>{
    const elx = document.getElementById(id);
    if(!elx) return;
    elx.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){
        if(id==='starterInput') startTutor();
        else if(id==='fUid' || id==='fPass') submitProfile();
        else if(id==='fFacultyPass') submitInstructor();
        else sendMessage(id.replace('input-',''));
      }
    });
  });
  scrollLog('academic'); scrollLog('tutor');
}

initSeedStorage();
document.getElementById('app').addEventListener('click', function(e){
  const row = e.target.closest('.concept-row[data-concept]');
  if(row) selectConcept(row.getAttribute('data-concept'));
});
render();
document.documentElement.setAttribute('lang', state.lang);
document.documentElement.setAttribute('dir', state.lang === 'ar' ? 'rtl' : 'ltr');
document.title = state.lang === 'ar' ? 'EDU AI — نموذج أولي' : 'EDU AI — Prototype';
</script>
